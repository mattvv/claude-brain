#cloud-config
# claude-brain droplet bootstrap. Secret-free by design: cloud-init user-data
# is readable from the droplet metadata endpoint, so nothing sensitive goes here.
# Used identically by install.sh --digitalocean and the manual DO-console path.
#
# Everything that installs software lives in host/bootstrap.sh, which a local
# Mac or Linux install runs too — this file only does the parts that are
# genuinely DigitalOcean-shaped: create the user, mirror the SSH keys, swap.

users:
  - name: brain
    groups: [sudo]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]

package_update: true
packages:
  - git
  - curl
  - ufw
  - unattended-upgrades

swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G

write_files:
  - path: /etc/ssh/sshd_config.d/99-brain.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      KbdInteractiveAuthentication no

runcmd:
  # SSH keys arrive on root via DigitalOcean; mirror them to the brain user.
  - mkdir -p /home/brain/.ssh
  - cp /root/.ssh/authorized_keys /home/brain/.ssh/authorized_keys || true
  - chown -R brain:brain /home/brain/.ssh
  - chmod 700 /home/brain/.ssh && chmod 600 /home/brain/.ssh/authorized_keys
  - systemctl restart ssh
  # claude-brain itself. bootstrap.sh installs the toolchain (Go, gh, tmux, jq,
  # Rust, Claude Code) and does the droplet-only hardening: ufw SSH-only and
  # `loginctl enable-linger` so the router survives logout.
  - sudo -u brain -H git clone https://github.com/mattvv/claude-brain.git /home/brain/claude-brain
  - sudo -u brain -H bash -lc '/home/brain/claude-brain/host/bootstrap.sh --profile droplet --unattended --with-rust'
  - sudo -u brain -H bash -lc '/home/brain/claude-brain/host/install.sh'
  # Build the router in the background so it's ready by the time the owner SSHes in.
  - sudo -u brain -H bash -lc 'PATH=$PATH:/usr/local/go/bin nohup /home/brain/claude-brain/host/bin/brain-proxy-build >> /home/brain/.local/state/brain/proxy-build.log 2>&1 &'

final_message: "claude-brain bootstrap finished after $UPTIME seconds. SSH in as 'brain' and run: brain setup"

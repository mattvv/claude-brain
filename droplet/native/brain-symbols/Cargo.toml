[package]
name = "brain-symbols"
version = "0.1.0"
edition = "2021"
description = "Stateless tree-sitter symbol extraction helper for brain-compress (defs/classify on stdin). Built in CI (H7); the droplet consumes prebuilt artifacts."
license = "MIT"

[dependencies]
serde_json = "1.0"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-bash = "0.23"

[profile.release]
lto = true
strip = true
codegen-units = 1

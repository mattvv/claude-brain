name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -x -S warning setup.sh host/install.sh host/bin/brain \
            host/bin/brain-ask host/bin/brain-proxy-build host/lib/common.sh \
            host/claude/statusline.sh host/claude/hooks/*.sh
      - name: cloud-init schema
        run: |
          sudo apt-get install -y cloud-init
          cloud-init schema --config-file cloud-init.yaml
      - name: patch checksum matches PIN
        run: |
          pinned=$(sed -n 's/^PATCH_SHA256=//p' host/proxy/PIN)
          actual=$(sha256sum host/proxy/patches/cliproxyapi-claude-effort.patch | cut -d' ' -f1)
          test "$pinned" = "$actual"
